global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "ptolemy"
    static_configs:
      - targets: ["ptolemy:3000"]
    metrics_path: /metrics
    # /metrics needs an admin JWT whenever PTOLEMY_JWT_SECRET is set. Mint one
    # with the platform secret and point prometheus at it:
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/ptolemy-admin-token
