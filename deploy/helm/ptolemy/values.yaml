replicaCount: 1

image:
  repository: ghcr.io/geolang/ptolemy
  pullPolicy: IfNotPresent
  # empty means v<appVersion>
  tag: ""

service:
  type: ClusterIP
  port: 3000

# required: a Secret holding the whole PostGIS DATABASE_URL, the chart brings no database
externalDatabase:
  existingSecret: ""
  existingSecretKey: url

# required: a Secret holding PLATFORM_JWT_SECRET, 32+ bytes shared with the other platform services
auth:
  existingSecret: ""
  existingSecretKey: jwt-secret

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

env:
  RUST_LOG: "info,ptolemy=debug"

nodeSelector: {}
tolerations: []
affinity: {}
