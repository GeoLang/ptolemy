apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ptolemy
  labels:
    app.kubernetes.io/name: ptolemy
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ptolemy
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ptolemy
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ptolemy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "externalDatabase.existingSecret is required: name a Secret holding the PostGIS DATABASE_URL, the chart brings no database" .Values.externalDatabase.existingSecret | quote }}
                  key: {{ .Values.externalDatabase.existingSecretKey | quote }}
            - name: PLATFORM_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.existingSecret is required: name a Secret holding PLATFORM_JWT_SECRET, 32+ random bytes" .Values.auth.existingSecret | quote }}
                  key: {{ .Values.auth.existingSecretKey | quote }}
            {{- range $key, $value := .Values.env }}
            {{- if has $key (list "DATABASE_URL" "PLATFORM_JWT_SECRET") }}
            {{- fail (printf "env.%s is not allowed: it comes from a Secret, set externalDatabase.existingSecret or auth.existingSecret" $key) }}
            {{- end }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
