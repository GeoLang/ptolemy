[package]
name = "ptolemy-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ptolemy-core = { path = "../ptolemy-core" }
ptolemy-storage = { path = "../ptolemy-storage" }
# multipart: the ArcGIS facade's attachment uploads arrive as multipart/form-data
axum = { workspace = true, features = ["multipart"] }
axum-extra.workspace = true
base64 = "0.22"
futures = "0.3"
getrandom.workspace = true
flatgeobuf = { version = "6.0.1", default-features = false }
geozero = { version = "0.15.1", default-features = false, features = ["with-geojson"] }
hex = "0.4"
hmac.workspace = true
jsonwebtoken = { workspace = true }
jung-esri.workspace = true
# rustls with ring, matching sqlx's tls backend; no pool, an invitation email
# builds its own transport
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1", "tokio1-rustls-tls"] }
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
openidconnect.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
time.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
urlencoding = "2"
uuid.workspace = true

[dev-dependencies]
hyper = { version = "1", features = ["full"] }
http-body-util = "0.1"
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["full", "test-util"] }
sqlx = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
# integration tests mint tokens the API layer must reject (expired, forged)
jsonwebtoken = { workspace = true }
serde = { workspace = true }
# a real websocket handshake: tower's oneshot has no hyper upgrade state, so it
# can never reach a 101 and cannot prove the subprotocol echo
tokio-tungstenite = "0.29"
