[workspace]
members = [
    "crates/ptolemy-core",
    "crates/ptolemy-api",
    "crates/ptolemy-cli",
    "crates/ptolemy-storage",
    "crates/ptolemy-elasticsearch",
    "crates/ptolemy-mongodb",
    "crates/ptolemy-geopackage",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/GeoLang/ptolemy"
authors = ["GeoLang <tiletopia@proton.me>"]
description = "Tile server for vector and raster map tiles"
rust-version = "1.88"

[workspace.dependencies]
# translates a migrated dataset's stored esri drawingInfo into mapbox gl layers
jung-esri = { git = "https://github.com/GeoLang/jung.git", branch = "master" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json", "uuid", "time", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.28"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["trace"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
geo-types = "0.7"
geozero = { version = "0.14", features = ["with-wkb", "with-geojson"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }
tower = { version = "0.5", features = ["limit", "buffer"] }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
hmac = "0.13"
sha2 = "0.11"
getrandom = "0.4"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
openidconnect = { version = "4", features = ["reqwest-blocking"] }
reqwest = { version = "0.12", features = ["json"] }
tokio-stream = { version = "0.1", features = ["sync"] }
