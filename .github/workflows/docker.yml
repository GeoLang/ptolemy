name: Docker

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/geolang/ptolemy
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ptolemy:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # consumers start this image and wait on its health endpoint, so a commit
      # that breaks startup or migrations has to fail here, not in their repo
      - name: Smoke test
        run: |
          docker network create smoke
          docker run -d --name smoke-db --network smoke \
            -e POSTGRES_USER=ptolemy -e POSTGRES_PASSWORD=ptolemy -e POSTGRES_DB=ptolemy \
            postgis/postgis:16-3.4
          for _ in $(seq 1 30); do
            docker exec smoke-db pg_isready -U ptolemy -q && break
            sleep 2
          done
          docker run -d --name smoke-api --network smoke -p 3000:3000 \
            -e DATABASE_URL=postgres://ptolemy:ptolemy@smoke-db/ptolemy \
            -e PTOLEMY_JWT_SECRET=0123456789abcdef0123456789abcdef \
            ptolemy:smoke
          # readyz answers only once migrations are applied and the pool
          # connects, so it covers the whole startup path health cannot
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/v1/readyz && exit 0
            sleep 2
          done
          docker logs smoke-api
          exit 1

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
